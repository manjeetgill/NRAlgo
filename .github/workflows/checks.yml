# Build every incoming commit, not just the branch tip. No trading services are started.
name: Commit preflight
on: [push, pull_request]
permissions:
  contents: read
jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
  commits:
    runs-on: ubuntu-latest
    outputs:
      revisions: ${{ steps.revisions.outputs.revisions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: revisions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const { BASE_SHA: base, HEAD_SHA: head } = process.env;
          const valid = value => /^[a-f0-9]{40}$/.test(value || '') && !/^0+$/.test(value);
          if (!valid(head)) throw new Error('Invalid head revision');
          const commits = valid(base)
            ? execFileSync('git', ['rev-list', '--reverse', `${base}..${head}`], { encoding: 'utf8' }).trim().split('\n').filter(Boolean)
            : [head];
          if (!commits.length) commits.push(head);
          if (commits.length > 256) throw new Error('Split this push into at most 256 commits');
          appendFileSync(process.env.GITHUB_OUTPUT, `revisions=${JSON.stringify(commits)}\n`);
          JS
  build:
    needs: commits
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        revision: ${{ fromJSON(needs.commits.outputs.revisions) }}
    name: Build ${{ matrix.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build this exact commit in isolation
        run: node scripts/preflight-commit.mjs "${{ matrix.revision }}"
  release:
    # Publishing is never available to pull requests, forks or unverified commits.
    needs: [build, safety-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build runtime images on CI, never on the trading host
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          prefix="ghcr.io/${REPOSITORY,,}"
          for target in backend web calculation backup; do
            docker build --pull --target "$target" \
              --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --tag "$prefix-$target:sha-$GITHUB_SHA" .
          done
          echo "RELEASE_IMAGE_PREFIX=$prefix" >> "$GITHUB_ENV"
      - name: Gate publication on isolated restart and recovery drills
        run: node scripts/staging-recovery.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-${{ github.sha }}
          path: .runtime/staging-recovery.json
          if-no-files-found: ignore
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable release manifest
        run: |
          : > release.env
          for target in backend web calculation backup; do
            image="$RELEASE_IMAGE_PREFIX-$target:sha-$GITHUB_SHA"
            docker push "$image"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
            printf '%s_IMAGE=%s\n' "${target^^}" "$digest" >> release.env
          done
          for spec in POSTGRES=postgres:17-alpine CADDY=caddy:2-alpine; do
            name=${spec%%=*}
            image=${spec#*=}
            docker pull "$image"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
            printf '%s_IMAGE=%s\n' "$name" "$digest" >> release.env
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release.env
          retention-days: 90
