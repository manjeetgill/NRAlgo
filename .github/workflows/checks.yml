# Build every incoming commit, not just the branch tip. No trading services are started.
name: Commit preflight
on: [push, pull_request]
jobs:
  commits:
    runs-on: ubuntu-latest
    outputs:
      revisions: ${{ steps.revisions.outputs.revisions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: revisions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const { BASE_SHA: base, HEAD_SHA: head } = process.env;
          const valid = value => /^[a-f0-9]{40}$/.test(value || '') && !/^0+$/.test(value);
          if (!valid(head)) throw new Error('Invalid head revision');
          const commits = valid(base)
            ? execFileSync('git', ['rev-list', '--reverse', `${base}..${head}`], { encoding: 'utf8' }).trim().split('\n').filter(Boolean)
            : [head];
          if (!commits.length) commits.push(head);
          if (commits.length > 256) throw new Error('Split this push into at most 256 commits');
          appendFileSync(process.env.GITHUB_OUTPUT, `revisions=${JSON.stringify(commits)}\n`);
          JS
  build:
    needs: commits
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        revision: ${{ fromJSON(needs.commits.outputs.revisions) }}
    name: Build ${{ matrix.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build this exact commit in isolation
        run: node scripts/preflight-commit.mjs "${{ matrix.revision }}"
