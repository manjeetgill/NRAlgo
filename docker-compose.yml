# One host, one API. Only Caddy publishes public ports.
name: nraialgo-terminal
x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
x-app: &app
  <<: *service
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  stop_grace_period: 30s
  read_only: true
  pids_limit: 128
  tmpfs: ["/tmp:size=64m,mode=1777"]
x-database: &database
  DB_HOST: db
  DB_NAME: nexus
  DB_USER: nexus_app
  DB_PASSWORD_FILE: /run/secrets/app_database_password
  APP_ENV: production

services:
  db:
    <<: *service
    image: ${POSTGRES_IMAGE:?Use the digest-pinned release manifest}
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.75
    pids_limit: 128
    shm_size: 128m
    command:
      [
        postgres,
        -c,
        shared_buffers=128MB,
        -c,
        work_mem=4MB,
        -c,
        maintenance_work_mem=64MB,
        -c,
        max_connections=40,
      ]
    environment:
      POSTGRES_USER: nexus
      POSTGRES_DB: nexus
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    networks: [data]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    <<: *app
    restart: "no"
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    image: ${BACKEND_IMAGE:?Use the digest-pinned release manifest}
    environment:
      APP_ENV: production
      DB_HOST: db
      DB_NAME: nexus
      DB_USER: nexus
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      APP_DATABASE_PASSWORD_FILE: /run/secrets/app_database_password
      BACKUP_DATABASE_PASSWORD_FILE: /run/secrets/backup_database_password
    secrets:
      [postgres_password, app_database_password, backup_database_password]
    networks: [data]
    command:
      [
        node,
        --import,
        ./dist/backend/runtime-secrets.js,
        dist/backend/database.js,
      ]
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *app
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    cpu_shares: 1024
    image: ${BACKEND_IMAGE:?Use the digest-pinned release manifest}
    environment:
      <<: *database
      # Leave room for one 128-MiB scrypt job and native/socket buffers within 512 MiB.
      NODE_OPTIONS: --max-old-space-size=256
      APP_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN to your hostname}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-kotak}
      ZERODHA_API_KEY_FILE: /run/secrets/zerodha_api_key
      ZERODHA_API_SECRET_FILE: /run/secrets/zerodha_api_secret
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}
      KOTAK_STATIC_IP_CONFIRMED: ${KOTAK_STATIC_IP_CONFIRMED:-false}
      SETUP_TOKEN_FILE: /run/secrets/setup_token
      BROKER_ENCRYPTION_KEY_FILE: /run/secrets/broker_encryption_key
      REGISTRATION_TOKEN_FILE: /run/secrets/registration_token
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-false}
      TRUST_EDGE_IP: "true"
      CALCULATION_SERVICE_URL: http://calculator:8010
      CALCULATION_SERVICE_TOKEN_FILE: /run/secrets/calculation_service_token
      HISTORICAL_ARCHIVE_DIRECTORY: /app/.runtime/historical-parquet
    secrets:
      [
        app_database_password,
        setup_token,
        broker_encryption_key,
        registration_token,
        calculation_service_token,
        zerodha_api_key,
        zerodha_api_secret,
      ]
    volumes:
      - ${HISTORICAL_ARCHIVE_DIRECTORY:-./.runtime/historical-parquet}:/app/.runtime/historical-parquet:ro
    networks: [gateway, data, analytics, broker_egress]
    depends_on:
      migrate:
        condition: service_completed_successfully
      calculator:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  calculator:
    <<: *app
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.75
    cpu_shares: 256
    pids_limit: 64
    image: ${CALCULATION_IMAGE:?Use the digest-pinned release manifest}
    environment:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      CALCULATION_SERVICE_TOKEN_FILE: /run/secrets/calculation_service_token
    secrets: [calculation_service_token]
    networks: [analytics, reference_egress]
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  web:
    <<: *app
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    environment:
      NODE_OPTIONS: --max-old-space-size=256
    tmpfs:
      ["/tmp:size=32m,mode=1777", "/app/.next/cache:size=32m,uid=1000,gid=1000"]
    image: ${WEB_IMAGE:?Use the digest-pinned release manifest}
    networks: [frontend, gateway]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  caddy:
    <<: *service
    image: ${CADDY_IMAGE:?Use the digest-pinned release manifest}
    networks: [edge, frontend, gateway]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 64
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN to your hostname}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
  backup:
    <<: *app
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.25
    cpu_shares: 128
    image: ${BACKUP_IMAGE:?Use the digest-pinned release manifest}
    environment:
      APP_ENV: production
      DB_HOST: db
      DB_NAME: nexus
      DB_USER: nexus_backup
      DB_PASSWORD_FILE: /run/secrets/backup_database_password
      BACKUP_ENCRYPTION_KEY_FILE: /run/secrets/backup_encryption_key
      BACKUP_S3_URI: ${BACKUP_S3_URI:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?Set the DigitalOcean Spaces endpoint}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-blr1}
      SPACES_ACCESS_KEY_ID_FILE: /run/secrets/spaces_access_key_id
      SPACES_SECRET_ACCESS_KEY_FILE: /run/secrets/spaces_secret_access_key
      BACKUP_DATABASE_TIMEOUT_SECONDS: ${BACKUP_DATABASE_TIMEOUT_SECONDS:-1800}
    secrets:
      [
        backup_database_password,
        backup_encryption_key,
        spaces_access_key_id,
        spaces_secret_access_key,
      ]
    networks: [data, backup_egress]
    volumes:
      - backups:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, dist/backend/backup.js, --healthcheck]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  backups:

# Each consumer receives only its own mounts. Host files live in an owner-only directory.
secrets:
  postgres_password:
    file: ${SECRETS_DIR:?Set the private secret directory}/postgres_password
  app_database_password:
    file: ${SECRETS_DIR:?Set the private secret directory}/app_database_password
  backup_database_password:
    file: ${SECRETS_DIR:?Set the private secret directory}/backup_database_password
  broker_encryption_key:
    file: ${SECRETS_DIR:?Set the private secret directory}/broker_encryption_key
  backup_encryption_key:
    file: ${SECRETS_DIR:?Set the private secret directory}/backup_encryption_key
  setup_token:
    file: ${SECRETS_DIR:?Set the private secret directory}/setup_token
  registration_token:
    file: ${SECRETS_DIR:?Set the private secret directory}/registration_token
  calculation_service_token:
    file: ${SECRETS_DIR:?Set the private secret directory}/calculation_service_token
  zerodha_api_key:
    file: ${SECRETS_DIR:?Set the private secret directory}/zerodha_api_key
  zerodha_api_secret:
    file: ${SECRETS_DIR:?Set the private secret directory}/zerodha_api_secret
  spaces_access_key_id:
    file: ${SECRETS_DIR:?Set the private secret directory}/spaces_access_key_id
  spaces_secret_access_key:
    file: ${SECRETS_DIR:?Set the private secret directory}/spaces_secret_access_key

networks:
  edge: {}
  frontend: { internal: true }
  gateway: { internal: true }
  data: { internal: true }
  analytics: { internal: true }
  broker_egress: {}
  reference_egress: {}
  backup_egress: {}
