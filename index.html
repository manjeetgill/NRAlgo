    const { createRoot } = ReactDOM;
    const { MemoryRouter, Routes, Route, Link, useNavigate, useLocation } = ReactRouterDOM;

    // --- SHARED APP SHELL: SIDEBAR & HEADER ---

      const location = useLocation();
      const navigate = useNavigate();
      const currentPath = location.pathname;

      const [orderModalOpen, setOrderModalOpen] = useState(false);
      const [haltTriggered, setHaltTriggered] = useState(false);
      const [haltAlert, setHaltAlert] = useState(false);

      const navItems = [
        { label: "Overview", path: "/", icon: "grid_view", group: "Core Platform" },
        { label: "Portfolio & Equity", path: "/portfolio", icon: "pie_chart", group: "Core Platform" },
        { label: "Watchlists", path: "/watchlists", icon: "format_list_bulleted", group: "Core Platform" },
        { label: "Option Chain", path: "/option-chain", icon: "view_column", group: "Core Platform" },

        { label: "Spread Builder", path: "/spread-builder", icon: "tune", group: "Quant Execution" },
        { label: "Strategies Lab", path: "/strategies-lab", icon: "science", group: "Quant Execution" },
        { label: "Backtest Studio", path: "/backtest-studio", icon: "query_stats", group: "Quant Execution" },
        { label: "Live Orders", path: "/live-orders", icon: "receipt_long", group: "Quant Execution", badge: "3" },

        { label: "Brokers", path: "/brokers", icon: "dns", group: "Infrastructure", pulse: true },
        { label: "Risk & Security", path: "/risk-and-security", icon: "shield", group: "Infrastructure" }
      ];

      const handleHaltClick = () => {
        if (!haltTriggered) {
          if (window.confirm("EMERGENCY SAFETY HALT: Trigger immediate fail-closed circuit? All live working orders will be pulled.")) {
            setHaltTriggered(true);
            setHaltAlert(true);
            setTimeout(() => setHaltAlert(false), 4500);
          }
        } else {
          setHaltTriggered(false);
          alert("Trading desk unhalted. Normal routing restored.");
        }
      };

      return (
        <div class="min-h-screen bg-surface flex text-on-surface">
          {/* Emergency Alert Toast */}
          {haltAlert && (
            <div class="fixed top-20 right-6 z-50 bg-error-container text-on-error-container p-4 rounded shadow-2xl border border-error/40 flex items-center gap-3">

                    <span class="font-headline font-bold text-base">Quick Order Entry [F1]</span>

              <div class="flex items-center justify-between pt-1 text-xs">

          {/* Top Fixed Header */}

                  <span>Desk A • NIFTY Deriv</span>
                  <span class="material-symbols-outlined text-outline text-[16px]">expand_more</span>

                <div class="hidden xl:flex items-center gap-5 text-xs">
                  <div class="flex items-baseline gap-1 font-mono-code">

                    <span class="font-bold text-on-surface">25,418.30</span>
                    <span class="text-secondary font-medium">+0.56%</span>
                  </div>
                  <div class="flex items-baseline gap-1 font-mono-code">
                    <span class="text-[10px] font-semibold text-outline uppercase">BANKNIFTY</span>
                    <span class="font-bold text-on-surface">52,890.15</span>

                  <div class="flex items-baseline gap-1 font-mono-code">
                    <span class="text-[10px] font-semibold text-outline uppercase">INDIA VIX</span>
                    <span class="font-bold text-on-surface">12.84</span>
                    <span class="text-tertiary font-medium">-3.16%</span>
                  </div>
                  <div class="flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-secondary-container/20 text-secondary text-[11px]">
                    <span class="h-1.5 w-1.5 rounded-full bg-secondary animate-pulse"></span>
                    <span>NSE Open • All Systems Nominal</span>
                  </div>
                </div>
              </div>

              <div class="flex items-center gap-3">
                <button
                  onClick={() => setOrderModalOpen(true)}
                  class="flex items-center gap-1.5 px-3 py-1.5 rounded bg-primary-container text-on-primary-container font-headline text-xs font-semibold hover:bg-primary hover:text-on-primary transition-all shadow-sm active:scale-95"
                >
                  <span class="material-symbols-outlined text-[18px]">add</span>
                  <span>+ New Order [F1]</span>
                </button>

                <button
                  onClick={handleHaltClick}
                  class={`flex items-center gap-1 px-3 py-1.5 rounded font-headline text-xs font-semibold transition-all shadow-sm ${
                    haltTriggered
                      ? "bg-error text-on-error animate-pulse"
                      : "bg-error-container text-on-error-container hover:bg-error hover:text-on-error"
                  }`}
                >
                  <span class="material-symbols-outlined text-[18px]">emergency_home</span>
                  <span>{haltTriggered ? "RESUME" : "Halt"}</span>
                </button>

                <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center font-headline text-xs font-bold text-on-primary shadow ring-1 ring-primary/40 cursor-pointer" title="CQ Quantitative Account">
                  CQ
                </div>
              </div>
            </header>

            {/* Main Outlet */}
            <main class="w-full pt-16 bg-surface px-6 pb-12 flex-1">
              {children}
            </main>
          </div>
        </div>
      );
    }

            <div class="flex items-center gap-3">
              <span class="material-symbols-outlined text-primary text-[24px]">receipt_long</span>
              <div>
                <h1 class="font-headline text-xl font-bold text-on-surface">Live Orders Ledger & DMA Execution</h1>
                <span class="text-xs font-mono-code text-secondary flex items-center gap-1">
                  <span class="w-1.5 h-1.5 rounded-full bg-secondary animate-pulse"></span>
                  Primary: Kotak Neo (14ms) • Standby: Zerodha Kite
                </span>
              </div>
            </div>
            <button onClick={() => alert("Halt signal sent to all execution gateways")} class="px-3 py-1.5 rounded bg-error-container hover:bg-error text-on-error-container hover:text-on-error text-xs font-headline font-semibold transition-all">
              Halt Trading / Kill Desk
            </button>
          </div>

          {/* 4 Cards */}
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 font-mono-code">
            <div class="p-3 rounded bg-surface-container-low border border-outline-variant/20">
              <span class="text-[10px] text-outline uppercase block">Total Orders</span>
              <span class="font-headline text-2xl font-bold text-on-surface block mt-1">18 Fills</span>
              <span class="text-[10px] text-secondary">14 Filled • 2 Working</span>
            </div>
            <div class="p-3 rounded bg-surface-container-low border border-outline-variant/20">
              <span class="text-[10px] text-outline uppercase block">Intraday Turnover</span>
              <span class="font-headline text-2xl font-bold text-secondary block mt-1">₹84.50 L</span>
              <span class="text-[10px] text-outline">100% Cleared</span>
            </div>
            <div class="p-3 rounded bg-surface-container-low border border-outline-variant/20">
              <span class="text-[10px] text-outline uppercase block">Taxes & Brokerage</span>
              <span class="font-headline text-2xl font-bold text-on-surface block mt-1">₹1,420.00</span>
              <span class="text-[10px] text-outline">₹20 flat / order</span>
            </div>
            <div class="p-3 rounded bg-surface-container-low border border-outline-variant/20">
              <span class="text-[10px] text-outline uppercase block">Avg Latency</span>
              <span class="font-headline text-2xl font-bold text-secondary block mt-1">18.2 ms</span>
              <span class="text-[10px] text-secondary">Fastest tick 9.1ms</span>
            </div>
          </div>

          {/* Orders Table */}
          <div class="flex flex-col bg-surface-container-low rounded border border-outline-variant/20 overflow-hidden shadow-sm">
            <div class="p-3 bg-surface-container flex items-center justify-between text-xs border-b border-outline-variant/20">
              <div class="flex items-center gap-1.5 font-body">
                <button onClick={() => setFilter("all")} class={`px-3 py-1 rounded font-semibold ${filter === "all" ? "bg-primary-container text-on-primary-container" : "bg-surface-container-high text-outline"}`}>All (18)</button>
                <button onClick={() => setFilter("working")} class={`px-3 py-1 rounded font-semibold ${filter === "working" ? "bg-primary-container text-on-primary-container" : "bg-surface-container-high text-outline"}`}>Working (2)</button>
                <button onClick={() => setFilter("filled")} class={`px-3 py-1 rounded font-semibold ${filter === "filled" ? "bg-primary-container text-on-primary-container" : "bg-surface-container-high text-outline"}`}>Filled (14)</button>
                <button onClick={() => setFilter("cancelled")} class={`px-3 py-1 rounded font-semibold ${filter === "cancelled" ? "bg-primary-container text-on-primary-container" : "bg-surface-container-high text-outline"}`}>Cancelled (2)</button>
              </div>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs font-mono-code">
                <thead>
                  <tr class="bg-surface-container-lowest text-outline text-[10px] uppercase">
                    <th class="py-2.5 px-4">Time</th>
                    <th class="py-2.5 px-3">Order ID</th>
                    <th class="py-2.5 px-3">Instrument</th>
                    <th class="py-2.5 px-2">Side</th>
                    <th class="py-2.5 px-2 text-right">Qty</th>
                    <th class="py-2.5 px-3 text-right">Avg Price</th>
                    <th class="py-2.5 px-3">Status</th>
                    <th class="py-2.5 px-3 text-right">Action</th>
                  </tr>
                </thead>
                <tbody class="divide-y-0">
                  {filteredOrders.map(o => (
                    <tr key={o.id} class="hover:bg-surface-container border-b border-outline-variant/10">
                      <td class="py-2.5 px-4 text-outline">{o.time}</td>
                      <td class="py-2.5 px-3 text-on-surface font-semibold">#{o.id}</td>
                      <td class="py-2.5 px-3 font-headline font-bold text-on-surface">{o.sym}</td>
                      <td class="py-2.5 px-2">
                        <span class={`px-1.5 py-0.5 rounded text-[10px] font-bold ${o.side === "BUY" ? "bg-secondary-container/20 text-secondary" : "bg-tertiary-container/20 text-tertiary"}`}>
                          {o.side}
                        </span>
                      </td>
                      <td class="py-2.5 px-2 text-right">{o.filled} / {o.total}</td>
                      <td class="py-2.5 px-3 text-right font-bold text-on-surface">{o.price}</td>
                      <td class="py-2.5 px-3">
                        <span class={`px-2 py-0.5 rounded text-[10px] font-bold ${
                          o.status === "filled" ? "bg-secondary/15 text-secondary" : o.status === "working" ? "bg-primary/15 text-primary animate-pulse" : "bg-error/15 text-error"
                        }`}>
                          {o.status.toUpperCase()}
                        </span>
                      </td>
                      <td class="py-2.5 px-3 text-right">
                        <button onClick={() => alert(`Details for ${o.id}`)} class="px-2 py-0.5 rounded bg-surface-container-high hover:bg-surface-bright text-xs">Inspect</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // TOP-LEVEL APPLICATION ROOT WITH MEMORY ROUTER
    // ==========================================
    function App() {
      return (
        <MemoryRouter initialEntries={["/"]} initialIndex={0}>
          <AppLayout>
            <Routes>
              <Route path="/" element={<ScreenOverview />} />
              <Route path="/portfolio" element={<ScreenPortfolio />} />
              <Route path="/watchlists" element={<ScreenWatchlists />} />
              <Route path="/option-chain" element={<ScreenOptionChain />} />
              <Route path="/spread-builder" element={<ScreenSpreadBuilder />} />
              <Route path="/strategies-lab" element={<ScreenStrategiesLab />} />
              <Route path="/backtest-studio" element={<ScreenBacktestStudio />} />
              <Route path="/live-orders" element={<ScreenLiveOrders />} />
              <Route path="/brokers" element={<ScreenBrokers />} />
              <Route path="/risk-and-security" element={<ScreenRiskAndSecurity />} />
            </Routes>
          </AppLayout>
        </MemoryRouter>
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
